name: Windows 构建与测试
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 编译程序
        shell: pwsh
        run: ./build.ps1
      - name: 运行完整核心与模拟命令行测试
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: 独立太阳事件对比
        shell: pwsh
        run: |
          python -m pip install astral==3.2 --disable-pip-version-check
          python tests/compare_astral.py
      - name: 构建便携预览包
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: HorizonSync-preview
          path: |
            dist/HorizonSync-*-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
