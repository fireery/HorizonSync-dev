name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile application
        shell: pwsh
        run: ./build.ps1
      - name: Compile project with MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found.' }
          & $msbuild HorizonSync.csproj /nologo /verbosity:minimal /p:Configuration=Release /p:OutputPath=build\msbuild\
          if ($LASTEXITCODE -ne 0) { throw 'Project build failed.' }
      - name: Run complete core and mock CLI tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Run picker lifecycle and metadata tests
        shell: pwsh
        run: ./tests/Run-PickerTests.ps1
      - name: Independent solar comparison
        shell: pwsh
        run: |
          python -m pip install astral==3.2 --disable-pip-version-check
          python tests/compare_astral.py
      - name: Build portable preview
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: HorizonSync-preview
          path: |
            dist/HorizonSync-*-Portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
